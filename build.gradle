plugins {
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'jacoco'
}

version = project.mod_version
group = project.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

base {
    archivesName = 'oc2r-wireless-pubsub'
}

repositories {
    maven { url = 'https://cursemaven.com' }
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
        }

        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDirs += 'src/generated/resources'
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    compileOnly fg.deobf("curse.maven:oc2r-${project.oc2r_project_id}:${project.oc2r_file_id}")
    runtimeOnly fg.deobf("curse.maven:oc2r-${project.oc2r_project_id}:${project.oc2r_file_id}")
    runtimeOnly fg.deobf("curse.maven:markdownmanual-${project.markdown_manual_project_id}:${project.markdown_manual_file_id}")
    runtimeOnly fg.deobf("curse.maven:architectury-api-${project.architectury_project_id}:${project.architectury_file_id}")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, include: ['com/bettercontent/oc2rwirelesspubsub/data/**'])
        })
    )
}

jacocoTestCoverageVerification {
    dependsOn test
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, include: ['com/bettercontent/oc2rwirelesspubsub/data/**'])
        })
    )
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.register('verifyFast') {
    group = 'verification'
    description = 'Runs the fast deterministic verification lane.'
    dependsOn tasks.named('check')
}

tasks.register('verifyFull') {
    group = 'verification'
    description = 'Runs the full verification lane. This project currently has no higher-signal lane beyond verifyFast.'
    dependsOn tasks.named('verifyFast')
}

jar {
    manifest {
        attributes([
                'Specification-Title': project.mod_name,
                'Specification-Vendor': 'oc2r_wireless_pubsub authors',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'oc2r_wireless_pubsub'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('stageRuntimeJar', Copy) {
    group = 'build'
    description = 'Stages the reobfuscated runtime jar into build/libs using the canonical release filename.'
    dependsOn tasks.named('reobfJar')
    from layout.buildDirectory.file('reobfJar/output.jar')
    into layout.buildDirectory.dir('libs')
    rename { "${project.base.archivesName.get()}-${project.version}.jar" }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('stageRuntimeJar')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id           : project.mod_id,
            mod_name         : project.mod_name,
            mod_version      : project.mod_version,
            mc_version       : project.mc_version,
            forge_version    : project.forge_version
    ]

    inputs.properties(replaceProperties)

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            name = 'mavenLocal'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
